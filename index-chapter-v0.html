<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ed">
<title>Chapter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');
:root{--cream:#f8f4ed;--card:#fffdfa;--ink:#17202a;--muted:#74787e;--accent:#585ad2;--line:#e6dfd5;--shadow:0 15px 34px rgba(75,63,49,.09)}
*{box-sizing:border-box}body{margin:0;background:#ece9e3;font-family:"DM Sans",sans-serif;color:var(--ink);display:flex;justify-content:center}button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{width:min(100%,520px);min-height:100vh;background:var(--cream);padding:env(safe-area-inset-top) 14px calc(112px + env(safe-area-inset-bottom))}
.topbar{height:82px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.wordmark{font-size:15px;letter-spacing:.42em;font-weight:600}.avatar,.iconbtn{border:0;background:transparent}.avatar{display:flex;gap:8px;align-items:center}.avatar b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f1ece4;border:1px solid #ddd5cb;font-family:"Playfair Display";font-size:24px}.iconbtn{justify-self:end}
h1,h2{font-family:"Playfair Display",serif;font-weight:500}.intro,.pageTitle{padding:8px}.intro h1,.pageTitle h1{font-size:clamp(34px,8vw,46px);margin:0}.intro p,.pageTitle p{color:var(--muted);margin:7px 0 0}.eyebrow{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.16em}
.card{background:var(--card);border:1px solid #e2dbd1;border-radius:27px;box-shadow:var(--shadow)}.content,.page{display:grid;gap:14px}
.reading{padding:22px;display:grid;grid-template-columns:42% 1fr;gap:20px;position:relative}.reading img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 18px 24px rgba(0,0,0,.25)}.readingInfo{display:flex;flex-direction:column;justify-content:center}.pill{align-self:flex-start;background:#ecebfd;color:var(--accent);font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px}.readingInfo h2{font-size:38px;margin:12px 0 0}.author,.pages{color:var(--muted);margin:0}.pct{font-family:"Playfair Display";font-size:48px;color:var(--accent);margin-top:14px}.pct span{font-size:24px}.track,.goal{height:7px;background:#e6e3df;border-radius:99px;overflow:hidden}.track{margin:14px 0 20px}.track span,.goal i{display:block;height:100%;background:var(--accent)}.primary{border:0;border-radius:18px;background:linear-gradient(135deg,#4f52c4,#5d61da);color:white;padding:15px 17px;display:flex;justify-content:space-between}.more{position:absolute;right:18px;top:18px;border:0;background:#f5f1eb;border-radius:50%;width:38px;height:38px}
.chapter{display:grid;grid-template-columns:24% 26% 1fr;overflow:hidden;min-height:205px}.chapterArt{background:linear-gradient(145deg,#f6ead7,#e8ddca);position:relative}.arch{position:absolute;width:72%;height:76%;left:14%;top:14%;border-radius:60px 60px 8px 8px;background:linear-gradient(145deg,#887964,#d7cbb9 50%,#fff8ec)}.chapterMain{padding:25px 8px 20px 20px}.chapterMain h2{font-size:48px;margin:10px 0}.goal{margin-top:14px}.goal i{width:40%}.stats,.profileStats{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.stat{text-align:center;border-left:1px solid var(--line)}.stat:first-child{border-left:0}.stat strong{display:block;font-family:"Playfair Display";font-size:24px}.stat span{font-size:12px;color:var(--muted)}
.library{padding:18px 16px}.sectionHead{display:flex;justify-content:space-between;align-items:center}.sectionHead h2{font-size:24px}.sectionHead button,.sectionHead span{border:0;background:transparent;color:var(--muted)}.bookGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.book{border:0;background:transparent;padding:0}.book img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;box-shadow:0 8px 12px rgba(0,0,0,.16)}
.quote{padding:22px;display:grid;grid-template-columns:auto 1fr 95px;align-items:center}.quoteMark{font-size:64px;color:var(--accent)}.quote p{font-family:"Playfair Display";font-size:18px}.quote span{color:var(--accent);font-size:13px}.chair{font-size:72px;color:var(--accent)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);height:92px;background:rgba(255,253,249,.95);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:12px 17px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #e7e1d8}.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#687079}.bottom button.active{color:var(--accent);font-weight:600}.bottom .add{width:72px;height:72px;border-radius:50%;align-self:center;margin-top:-40px;background:var(--accent);color:white;display:grid;place-items:center;font-size:36px}
.search{display:flex;gap:10px;background:white;border:1px solid var(--line);border-radius:18px;padding:14px}.search input{border:0;outline:0;width:100%}.feature{background:linear-gradient(135deg,#2b2f44,#5d61cf);color:white;border-radius:27px;padding:20px;display:grid;grid-template-columns:1fr 110px}.feature img{width:100%;border-radius:12px}.chips,.filters{display:flex;gap:8px;overflow:auto}.chips button,.filters button{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 14px;white-space:nowrap}.filters .sel{background:var(--accent);color:white}.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.catalog button{border:0;background:transparent;text-align:left;padding:0}.catalog img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px}.catalog strong,.catalog span{display:block}.catalog span{font-size:12px;color:var(--muted)}
.profileHero{text-align:center}.profileAvatar{width:88px;height:88px;border-radius:50%;margin:auto;background:var(--accent);color:white;display:grid;place-items:center;font-family:"Playfair Display";font-size:42px}.profileHero h1{font-size:48px;margin:8px}.profileStats,.profileCard,.settings{padding:22px}.settings button{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:18px;display:flex;justify-content:space-between}.settings button:first-child{border-top:0}
.detailTop{height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.detailTop button{border:0;background:white;border-radius:50%;width:42px;height:42px}.detailTop button:last-child{justify-self:end}.detailHero{text-align:center}.detailHero img{width:44%;max-width:190px;aspect-ratio:2/3;object-fit:cover;border-radius:16px}.detailHero h1{font-size:42px;margin:8px}.detailCard{padding:22px;margin-top:14px}.detailMeta{display:grid;grid-template-columns:repeat(3,1fr)}.detailMeta div{text-align:center;border-left:1px solid var(--line)}.detailMeta div:first-child{border-left:0}
.sheetBg{position:fixed;inset:0;background:rgba(19,22,27,.28);display:flex;align-items:flex-end;justify-content:center;z-index:40}.sheet{width:min(100%,520px);background:white;border-radius:28px 28px 0 0;padding:20px}.sheet button{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:18px;text-align:left}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:#1d2530;color:white;padding:12px 16px;border-radius:14px;z-index:60}
@media(max-width:430px){.app{padding-left:12px;padding-right:12px}.reading{grid-template-columns:40% 1fr;gap:15px;padding:18px}.readingInfo h2{font-size:32px}.pct{font-size:40px}.chapter{grid-template-columns:25% 27% 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar" id="header"><button class="avatar"><b>C</b>⌄</button><div class="wordmark">CHAPTER</div><button class="iconbtn">🔔</button></header>
<main id="screen"></main>
<nav class="bottom" id="bottom"><button data-tab="today" class="active">⌂<span>Aujourd’hui</span></button><button data-tab="explore">⌕<span>Explorer</span></button><button class="add" id="addBtn">＋</button><button data-tab="library">▥<span>Bibliothèque</span></button><button data-tab="profile">◯<span>Profil</span></button></nav>
</div>
<div id="sheet" class="sheetBg hidden"><section class="sheet"><span class="eyebrow">NOUVEAU</span><h2>Ajouter un livre</h2><button data-action="Recherche ouverte">🔍 Rechercher un livre</button><button data-action="Scanner ISBN ouvert">▣ Scanner un ISBN</button><button data-action="Ajout manuel ouvert">✎ Ajouter manuellement</button></section></div>
<div id="toast" class="toast hidden"></div>
<script>
const books=[
{id:1,title:"Dune",author:"Frank Herbert",cover:"https://covers.openlibrary.org/b/isbn/9780441013593-L.jpg",status:"En cours",progress:72,pagesRead:312,totalPages:432,genre:"Science-fiction",rating:4.7},
{id:2,title:"1984",author:"George Orwell",cover:"https://covers.openlibrary.org/b/isbn/9780451524935-L.jpg",status:"Lu",progress:100,pagesRead:328,totalPages:328,genre:"Dystopie",rating:4.6},
{id:3,title:"Sapiens",author:"Yuval Noah Harari",cover:"https://covers.openlibrary.org/b/isbn/9780062316097-L.jpg",status:"Lu",progress:100,pagesRead:498,totalPages:498,genre:"Essai",rating:4.4},
{id:4,title:"L'Étranger",author:"Albert Camus",cover:"https://covers.openlibrary.org/b/isbn/9782070360024-L.jpg",status:"Lu",progress:100,pagesRead:184,totalPages:184,genre:"Classique",rating:4.2},
{id:5,title:"Le Hobbit",author:"J. R. R. Tolkien",cover:"https://covers.openlibrary.org/b/isbn/9780261102217-L.jpg",status:"À lire",progress:0,pagesRead:0,totalPages:310,genre:"Fantasy",rating:4.8},
{id:6,title:"La Métamorphose",author:"Franz Kafka",cover:"https://covers.openlibrary.org/b/isbn/9782070366594-L.jpg",status:"Lu",progress:100,pagesRead:144,totalPages:144,genre:"Classique",rating:4.1},
{id:7,title:"Harry Potter",author:"J. K. Rowling",cover:"https://covers.openlibrary.org/b/isbn/9780747532699-L.jpg",status:"Lu",progress:100,pagesRead:320,totalPages:320,genre:"Fantasy",rating:4.7},
{id:8,title:"Les Misérables",author:"Victor Hugo",cover:"https://covers.openlibrary.org/b/isbn/9782070409228-L.jpg",status:"À lire",progress:0,pagesRead:0,totalPages:1664,genre:"Classique",rating:4.5},
{id:9,title:"L'Alchimiste",author:"Paulo Coelho",cover:"https://covers.openlibrary.org/b/isbn/9780061122415-L.jpg",status:"Lu",progress:100,pagesRead:208,totalPages:208,genre:"Roman",rating:4.0},
{id:10,title:"Never Let Me Go",author:"Kazuo Ishiguro",cover:"https://covers.openlibrary.org/b/isbn/9781400078776-L.jpg",status:"À lire",progress:0,pagesRead:0,totalPages:304,genre:"Roman",rating:4.3}
];
const quotes=[["Un livre est un rêve que l’on tient dans ses mains.","Neil Gaiman"],["Un lecteur vit mille vies avant de mourir.","George R. R. Martin"],["La lecture est une amitié.","Marcel Proust"],["Les livres sont une magie uniquement transportable.","Stephen King"]];
let tab="today",selected=null,filter="Tous";
const screen=document.getElementById("screen"),header=document.getElementById("header"),bottom=document.getElementById("bottom"),sheet=document.getElementById("sheet"),toast=document.getElementById("toast");
function notify(m){toast.textContent=m;toast.classList.remove("hidden");clearTimeout(window.t);window.t=setTimeout(()=>toast.classList.add("hidden"),1800)}
function tile(b){return `<button class="book" data-book="${b.id}"><img src="${b.cover}"></button>`}
function cat(b){return `<button data-book="${b.id}"><img src="${b.cover}"><strong>${b.title}</strong><span>${b.author}</span></button>`}
function bindBooks(){document.querySelectorAll("[data-book]").forEach(x=>x.onclick=()=>{selected=books.find(b=>b.id==x.dataset.book);render()})}
function renderToday(){const b=books[0],q=quotes[new Date().getDate()%quotes.length];screen.innerHTML=`<div class="content"><section class="intro"><h1>Bonjour, Steph 👋</h1><p>Votre prochaine page vous attend.</p></section><section class="card reading"><img src="${b.cover}" data-book="1"><div class="readingInfo"><span class="pill">EN COURS</span><h2>${b.title}</h2><p class="author">${b.author}</p><div class="pct">${b.progress}<span>%</span></div><p class="pages">${b.pagesRead} / ${b.totalPages} pages</p><div class="track"><span style="width:${b.progress}%"></span></div><button class="primary" id="continue">Continuer la lecture <span>→</span></button></div><button class="more">•••</button></section><section class="card chapter"><div class="chapterArt"><div class="arch"></div></div><div class="chapterMain"><span class="eyebrow">CHAPITRE I</span><h2>2026</h2><strong>12 / 30 livres</strong><div class="goal"><i></i></div></div><div class="stats"><div class="stat">📖<strong>12</strong><span>livres</span></div><div class="stat">▤<strong>4 382</strong><span>pages</span></div><div class="stat">◯<strong>8</strong><span>auteurs</span></div></div></section><section class="card library"><div class="sectionHead"><h2>Ma bibliothèque</h2><button onclick="switchTab('library')">Tout voir →</button></div><div class="bookGrid">${books.map(tile).join("")}</div></section><section class="card quote"><div class="quoteMark">“</div><div><p>${q[0]}</p><span>${q[1]}</span></div><div class="chair">◒</div></section></div>`;document.getElementById("continue").onclick=()=>{b.progress=Math.min(100,b.progress+3);b.pagesRead=Math.min(b.totalPages,b.pagesRead+13);notify("Progression mise à jour");render()};bindBooks()}
function renderExplore(){screen.innerHTML=`<div class="page"><section class="pageTitle"><span class="eyebrow">DÉCOUVRIR</span><h1>Explorer</h1><p>Trouvez votre prochaine lecture.</p></section><div class="search">⌕<input id="q" placeholder="Titre, auteur ou genre"></div><section class="feature"><div><span class="eyebrow" style="color:white">SÉLECTION CHAPTER</span><h2>Des mondes à découvrir</h2><p>Une sélection pensée pour vous.</p></div><img src="${books[4].cover}"></section><div class="chips">${["Pour vous","Romans","Fantasy","Classiques"].map(x=>`<button>${x}</button>`).join("")}</div><section class="card library"><div class="sectionHead"><h2>Suggestions</h2><span id="count">${books.length} livres</span></div><div class="catalog" id="catalog">${books.map(cat).join("")}</div></section></div>`;const q=document.getElementById("q");q.oninput=()=>{const f=books.filter(b=>(b.title+" "+b.author+" "+b.genre).toLowerCase().includes(q.value.toLowerCase()));document.getElementById("catalog").innerHTML=f.map(cat).join("");document.getElementById("count").textContent=f.length+" livres";bindBooks()};bindBooks()}
function renderLibrary(){const f=filter==="Tous"?books:books.filter(b=>b.status===filter);screen.innerHTML=`<div class="page"><section class="pageTitle"><span class="eyebrow">COLLECTION</span><h1>Ma bibliothèque</h1><p>${books.length} livres dans votre histoire.</p></section><div class="filters">${["Tous","En cours","Lu","À lire"].map(x=>`<button data-filter="${x}" class="${filter===x?"sel":""}">${x}</button>`).join("")}</div><section class="card library"><div class="catalog">${f.map(cat).join("")}</div></section></div>`;document.querySelectorAll("[data-filter]").forEach(x=>x.onclick=()=>{filter=x.dataset.filter;renderLibrary()});bindBooks()}
function renderProfile(){screen.innerHTML=`<div class="page"><section class="profileHero"><div class="profileAvatar">S</div><span class="eyebrow">LA BIBLIOTHÈQUE DE</span><h1>Steph</h1><p>Chaque livre écrit votre histoire.</p></section><section class="card profileStats"><div class="stat">📖<strong>${books.length}</strong><span>livres</span></div><div class="stat">▤<strong>4 382</strong><span>pages</span></div><div class="stat">◯<strong>8</strong><span>auteurs</span></div></section><section class="card profileCard"><span class="eyebrow">CHAPITRE I</span><h2>Votre année 2026</h2><p>12 livres terminés sur un objectif de 30.</p><div class="goal"><i></i></div></section><section class="card settings">${["Modifier mon profil","Nom de ma bibliothèque","Préférences","À propos de Chapter"].map(x=>`<button onclick="notify('${x} ouvert')"><span>${x}</span><span>›</span></button>`).join("")}</section></div>`}
function renderDetail(){const b=selected;screen.innerHTML=`<div><div class="detailTop"><button id="back">‹</button><span>CHAPTER</span><button onclick="notify('Ajouté aux favoris')">☆</button></div><section class="detailHero"><img src="${b.cover}"><span class="eyebrow">${b.genre}</span><h1>${b.title}</h1><p>${b.author}</p><div>★ ${b.rating}</div></section><section class="card detailCard detailMeta"><div><span>Statut</span><strong>${b.status}</strong></div><div><span>Pages</span><strong>${b.totalPages}</strong></div><div><span>Progression</span><strong>${b.progress}%</strong></div></section><section class="card detailCard"><span class="eyebrow">MON SOUVENIR</span><h2>Une lecture qui compte</h2><p>Ajoutez ici votre ressenti, une citation ou le souvenir lié à cette lecture.</p><button class="primary" onclick="notify('Souvenir enregistré')">Ajouter un souvenir <span>✎</span></button></section></div>`;document.getElementById("back").onclick=()=>{selected=null;render()}}
function switchTab(x){tab=x;selected=null;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===x));render()}
function render(){header.classList.toggle("hidden",!!selected);bottom.classList.toggle("hidden",!!selected);if(selected)return renderDetail();if(tab==="today")renderToday();if(tab==="explore")renderExplore();if(tab==="library")renderLibrary();if(tab==="profile")renderProfile()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById("addBtn").onclick=()=>sheet.classList.remove("hidden");sheet.onclick=e=>{if(e.target===sheet)sheet.classList.add("hidden")};sheet.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{notify(b.dataset.action);sheet.classList.add("hidden")});render();
</script>
</body></html>
